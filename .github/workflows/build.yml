name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/monitor-linux-${GOARCH} ./cmd/monitor
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-linux-${{ matrix.arch }}
          path: dist/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: monitor-linux-*
          path: dist
          merge-multiple: true
      - name: Publish V0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum monitor-linux-* > SHA256SUMS)
          gh release view v0.3.0 --repo "${{ github.repository }}" >/dev/null 2>&1 && exit 0
          gh release create v0.3.0 dist/monitor-linux-* dist/SHA256SUMS --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Monitor V0.3.0" --notes "Dashboard node enrollment, per-node install commands, historical network traffic, native installer."
