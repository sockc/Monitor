name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Check embedded dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          code = Path("cmd/monitor/assets.go").read_text()
          js = code.split("const appJS=`", 1)[1].split("`\n", 1)[0]
          with tempfile.NamedTemporaryFile(suffix=".js", mode="w", encoding="utf-8") as f:
              f.write(js)
              f.flush()
              subprocess.run(["node", "--check", f.name], check=True)
          PY
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/monitor-linux-${GOARCH} ./cmd/monitor
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-linux-${{ matrix.arch }}
          path: dist/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: monitor-linux-*
          path: dist
          merge-multiple: true
      - name: Publish V0.7.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum monitor-linux-* > SHA256SUMS)
          HEAD_SHA="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)"
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then echo "Skipping outdated run"; exit 0; fi
          if gh release view v0.7.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v0.7.1 dist/monitor-linux-* dist/SHA256SUMS --clobber --repo "${{ github.repository }}"
            gh release edit v0.7.1 --target "${{ github.sha }}" --repo "${{ github.repository }}"
            exit 0
          fi
          gh release create v0.7.1 dist/monitor-linux-* dist/SHA256SUMS --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Monitor V0.7.1" --notes "Refined overview and dedicated statistics, alerts and settings views."
