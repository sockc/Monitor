name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/monitor-linux-${GOARCH} ./cmd/monitor
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-linux-${{ matrix.arch }}
          path: dist/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: monitor-linux-*
          path: dist
          merge-multiple: true
      - name: Publish V0.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum monitor-linux-* > SHA256SUMS)
          HEAD_SHA="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)"
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then echo "Skipping outdated run"; exit 0; fi
          if gh release view v0.6.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v0.6.0 dist/monitor-linux-* dist/SHA256SUMS --clobber --repo "${{ github.repository }}"
            gh release edit v0.6.0 --target "${{ github.sha }}" --repo "${{ github.repository }}"
            exit 0
          fi
          gh release create v0.6.0 dist/monitor-linux-* dist/SHA256SUMS --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Monitor V0.6.0" --notes "Editable Chinese display names, groups and notes."
